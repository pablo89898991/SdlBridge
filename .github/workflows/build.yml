name: Build SDL3 bridge APK
# SDL3 comes from the release pinned in droiddeck/sdl3.env (SHA-256 checked) -- the same one SDL3DroidDeck builds with.
# The "SDL update" workflow moves that pin when SDL publishes a new stable release, tests it, and starts this build.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write           # needed to publish the release the app's updater reads
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pinned SDL release
        id: sdl
        run: |
          . droiddeck/sdl3.env
          echo "tag=release-$SDL_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "SDL $SDL_VERSION (droiddeck/sdl3.env)"

      - uses: actions/setup-java@v5
        if: steps.sdl.outputs.build == 'true'
        with: { distribution: temurin, java-version: 17 }

      - name: Accept Android licenses
        if: steps.sdl.outputs.build == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Fetch SDL3 and its Android Java classes
        if: steps.sdl.outputs.build == 'true'
        run: |
          bash tools/sdl-fetch.sh app/jni/SDL
          mkdir -p app/src/main/java
          cp -r app/jni/SDL/android-project/app/src/main/java/org app/src/main/java/
          # SDL ships its own Gradle wrapper jar; gradle/actions refuses to run if it finds an unknown one.
          find app/jni/SDL -name 'gradle-wrapper.jar' -delete

      - name: Stamp build info (read by the in-app updater)
        if: steps.sdl.outputs.build == 'true'
        run: |
          mkdir -p app/src/main/assets
          printf 'repo=%s\ntag=build-%s\nsdl=%s\n' "$GITHUB_REPOSITORY" "${{ github.run_number }}" "${{ steps.sdl.outputs.tag }}" > app/src/main/assets/build.txt
          cat app/src/main/assets/build.txt

      - uses: gradle/actions/setup-gradle@v4
        if: steps.sdl.outputs.build == 'true'
        with: { gradle-version: "8.9" }

      - name: Build APK
        if: steps.sdl.outputs.build == 'true'
        run: gradle :app:assembleDebug --no-daemon -Pvc=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: steps.sdl.outputs.build == 'true'
        with:
          name: SdlBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        if: steps.sdl.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SDL3BridgeDroidDeck.apk
          gh release create "build-${{ github.run_number }}" SDL3BridgeDroidDeck.apk \
            --title "Bridge build ${{ github.run_number }} (SDL ${{ steps.sdl.outputs.tag }})" \
            --notes "sdl=${{ steps.sdl.outputs.tag }}" --latest
